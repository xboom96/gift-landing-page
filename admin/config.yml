backend:
  name: github
  repo: xboom96/gift-landing-page
  branch: main
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "landing_page"
    label: "Store Content"
    files:
      - file: "content/settings.json"
        label: "Landing Page Settings"
        name: "settings"
        fields:
          # --- SECTION 1: HEADER & VISIBILITY ---
          - { label: "Brand Logo Text", name: "logo_text", widget: "string", default: "AURA GIFTS" }
          - { label: "Show Announcement Bar?", name: "show_promo", widget: "boolean", default: true }
          - { label: "Announcement Bar Text", name: "promo_text", widget: "string", default: "✨ 50% OFF FLASH SALE ENDING IN:" }
          - { label: "Show Live Shoppers Bar?", name: "show_live_proof", widget: "boolean", default: true }
          - { label: "Live Shoppers Text", name: "live_proof_text", widget: "string", default: "23 shoppers viewing right now | 148 orders placed today" }

          # --- SECTION 2: PRODUCT CORE ---
          - { label: "Product Title", name: "product_title", widget: "string", default: "Magnetic Levitating Santa Sleigh (Holiday Ambient Edition)" }
          - { label: "Review Rating Summary", name: "review_summary", widget: "string", default: "★★★★★ 4.9/5 (1,420+ Verified Reviews)" }
          - { label: "Show Stock Urgency Bar?", name: "show_urgency", widget: "boolean", default: true }
          - { label: "Remaining Stock Count", name: "stock_remaining", widget: "number", default: 5 }
          - { label: "Global Checkout URL", name: "checkout_url", widget: "string", default: "#" }

          # --- SECTION 3: PRODUCT GALLERY ---
          - label: "📸 Product Gallery Images (Orderable)"
            name: "gallery_images"
            widget: "list"
            collapsed: true
            summary: "Photo: {{fields.image_url}}"
            fields:
              - { label: "Image URL or Upload", name: "image_url", widget: "image" }

          # --- SECTION 4: FEATURE BULLETS ---
          - label: "✔ Feature Checklist (Orderable)"
            name: "feature_bullets"
            widget: "list"
            collapsed: true
            summary: "{{fields.text}}"
            fields:
              - { label: "Bullet Text", name: "text", widget: "string" }

          # --- SECTION 5: BUNDLES (RE-ORDER & REMOVE) ---
          - label: "📦 Pricing Bundles (Sort & Edit)"
            name: "bundles"
            widget: "list"
            collapsed: true
            summary: "Tier: {{fields.title}} | Price: ${{fields.total_price}}"
            fields:
              - { label: "Item Quantity", name: "qty", widget: "number", default: 1 }
              - { label: "Bundle Title", name: "title", widget: "string" }
              - { label: "Subtext / Offer Perks", name: "sub", widget: "string" }
              - { label: "Discounted Price ($)", name: "total_price", widget: "number", value_type: "float" }
              - { label: "Original Retail Price ($)", name: "orig_price", widget: "number", value_type: "float" }
              - { label: "Save Badge Text (e.g. Save 50%)", name: "save_text", widget: "string" }
              - { label: "Ribbon Badge (e.g. MOST POPULAR)", name: "ribbon", widget: "string", required: false }
              - { label: "Custom Checkout URL for this Bundle", name: "checkout_url", widget: "string", required: false }

          # --- SECTION 6: CUSTOMER REVIEWS ---
          - label: "⭐ Customer Reviews (Orderable)"
            name: "reviews"
            widget: "list"
            collapsed: true
            summary: "{{fields.user}}"
            fields:
              - { label: "Customer Name & Country", name: "user", widget: "string" }
              - { label: "Review Comment", name: "comment", widget: "text" }

          # --- SECTION 7: FAQS ---
          - label: "❓ Frequently Asked Questions (Sortable)"
            name: "faqs"
            widget: "list"
            collapsed: true
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
