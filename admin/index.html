<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Content Manager</title>
  </head>
  <body>
    <!-- Decap CMS Core Engine -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // 1. Google Font inject to Preview Frame
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

      // 2. Full Store Theme Styles
      const previewCss = `
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #FFFFFF; color: #111827; -webkit-font-smoothing: antialiased; }
        .promo-bar { background: #000; color: #FFF; font-size: 11px; font-weight: 700; text-align: center; padding: 10px; }
        .promo-timer { color: #FBBF24; font-weight: 800; margin-left: 4px; }
        .header { display: flex; align-items: center; justify-content: center; padding: 16px; border-bottom: 1px solid #E5E7EB; background: #FFF; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .live-proof { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px; font-size: 12px; font-weight: 600; background: #F0FDF4; color: #166534; border-bottom: 1px solid #DCFCE7; }
        .pulse-dot { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; }
        .wrapper { width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 16px; }
        .main-stage { width: 100%; aspect-ratio: 1/1; background: #FAFAFA; border-radius: 14px; overflow: hidden; border: 1px solid #E5E7EB; margin-bottom: 14px; }
        .main-stage img { width: 100%; height: 100%; object-fit: cover; }
        .reviews-count { font-size: 13px; font-weight: 700; color: #F59E0B; margin-bottom: 6px; }
        .prod-title { font-size: 22px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; }
        .price-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .price-current { font-size: 28px; font-weight: 800; color: #E11D48; }
        .price-original { font-size: 16px; color: #6B7280; text-decoration: line-through; }
        .save-badge { background: #FEE2E2; color: #E11D48; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 20px; text-transform: uppercase; }
        .urgency-box { background: #FFFBEB; border: 1px solid #FEF3C7; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .urgency-txt { font-size: 13px; font-weight: 700; color: #92400E; display: flex; justify-content: space-between; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; height: 6px; background: #FDE68A; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { width: 86%; height: 100%; background: #D97706; }
        .bundle-card { position: relative; background: #FFFFFF; border: 2px solid #E5E7EB; border-radius: 12px; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .bundle-card.selected { border-color: #111827; background: #FAFAFA; }
        .bundle-ribbon { position: absolute; top: -9px; right: 12px; background: #111; color: #FFF; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px; }
        .bundle-ribbon.popular { background: #E11D48; }
        .fallback-btn { width: 100%; padding: 17px; background: #111827; color: #FFFFFF; border-radius: 12px; font-size: 14px; font-weight: 800; border: none; margin-bottom: 20px; }
        .bullets-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 15px; margin-bottom: 24px; font-size: 13px; line-height: 1.8; }
        .bullets-card span { color: #059669; font-weight: 800; margin-right: 6px; }
        .review-item { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px; font-size: 12.5px; line-height: 1.5; margin-bottom: 12px; }
        .faq-item { border-bottom: 1px solid #E5E7EB; padding: 13px 0; font-size: 13px; }
        
        /* Luxury Footer */
        .luxury-footer { background: #000; color: #94A3B8; padding: 36px 16px 24px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 30px; }
        .trust-strip { background: #0B0E14; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; margin-bottom: 24px; }
        .trust-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .trust-item:last-child { margin-bottom: 0; }
      `;
      CMS.registerPreviewStyle(previewCss, { raw: true });

      // 3. Register Custom Preview Template
      const LiveCustomizer = createClass({
        render: function() {
          const entry = this.props.entry;
          
          const logo = entry.getIn(['data', 'logo_text']) || 'AURA GIFTS';
          const promo = entry.getIn(['data', 'promo_text']) || '✨ 50% OFF FLASH SALE ENDING IN:';
          const liveProof = entry.getIn(['data', 'live_proof_text']) || '';
          const title = entry.getIn(['data', 'product_title']) || '';
          const revSummary = entry.getIn(['data', 'review_summary']) || '★★★★★ 4.9/5';
          const stock = entry.getIn(['data', 'stock_remaining']) || 5;

          const gallery = entry.getIn(['data', 'gallery_images']);
          const bullets = entry.getIn(['data', 'feature_bullets']);
          const bundles = entry.getIn(['data', 'bundles']);
          const reviews = entry.getIn(['data', 'reviews']);
          const faqs = entry.getIn(['data', 'faqs']);

          let heroImg = 'https://images.unsplash.com/photo-1543257580-7269da773bf5?auto=format&fit=crop&w=800&q=80';
          if (gallery && gallery.size > 0) {
            const firstImg = gallery.get(0).get('image_url');
            if (firstImg) heroImg = this.props.getAsset(firstImg).toString();
          }

          let displayPrice = '59.99';
          let displayOrig = '139.98';
          let displaySave = 'SAVE 57%';
          if (bundles && bundles.size > 1) {
            displayPrice = bundles.get(1).get('total_price') || '59.99';
            displayOrig = bundles.get(1).get('orig_price') || '139.98';
            displaySave = bundles.get(1).get('save_text') || 'SAVE 57%';
          }

          return h('div', null,
            // Promo Bar
            h('div', { className: 'promo-bar' },
              promo, h('span', { className: 'promo-timer' }, ' 02:14:32')
            ),

            // Header
            h('div', { className: 'header' },
              h('div', { className: 'logo' }, logo)
            ),

            // Live Proof
            liveProof ? h('div', { className: 'live-proof' },
              h('div', { className: 'pulse-dot' }),
              h('span', null, liveProof)
            ) : null,

            // Main Product Frame
            h('div', { className: 'wrapper' },
              // Main Image
              h('div', { className: 'main-stage' },
                h('img', { src: heroImg })
              ),

              // Title & Ratings
              h('div', { className: 'reviews-count' }, revSummary),
              h('h1', { className: 'prod-title' }, title),

              // Price
              h('div', { className: 'price-row' },
                h('span', { className: 'price-current' }, '$' + displayPrice),
                h('span', { className: 'price-original' }, '$' + displayOrig),
                h('span', { className: 'save-badge' }, displaySave)
              ),

              // Stock Urgency
              h('div', { className: 'urgency-box' },
                h('div', { className: 'urgency-txt' },
                  h('span', null, '🔥 High Holiday Demand'),
                  h('span', null, 'Only ' + stock + ' Units Remaining!')
                ),
                h('div', { className: 'progress-bar-bg' },
                  h('div', { className: 'progress-bar-fill' })
                )
              ),

              // Bundles Preview
              bundles ? h('div', { style: { marginBottom: '18px' } },
                h('div', { style: { fontSize: '11px', fontWeight: '800', color: '#6B7280', textTransform: 'uppercase', marginBottom: '8px' } }, 'SELECT YOUR BUNDLE'),
                bundles.map((b, idx) => {
                  const ribbon = b.get('ribbon');
                  return h('div', { key: idx, className: 'bundle-card ' + (idx === 1 ? 'selected' : '') },
                    ribbon ? h('span', { className: 'bundle-ribbon ' + (ribbon.includes('POPULAR') ? 'popular' : '') }, ribbon) : null,
                    h('div', null,
                      h('div', { style: { fontSize: '13px', fontWeight: '800' } }, b.get('title') || 'Bundle Set'),
                      h('div', { style: { fontSize: '11px', color: '#059669', fontWeight: '600' } }, b.get('sub') || '')
                    ),
                    h('div', { style: { textAlign: 'right' } },
                      h('div', { style: { fontSize: '15px', fontWeight: '800' } }, '$' + (b.get('total_price') || ''))
                    )
                  );
                })
              ) : null,

              // CTA Button
              h('button', { className: 'fallback-btn' }, 'CLAIM OFFER & FREE DELIVERY'),

              // Feature Bullets
              bullets ? h('div', { className: 'bullets-card' },
                bullets.map((item, i) => h('div', { key: i }, h('span', null, '✔'), item.get('text')))
              ) : null,

              // Customer Reviews
              reviews ? h('div', { style: { marginTop: '28px' } },
                h('div', { style: { fontSize: '14px', fontWeight: '800', marginBottom: '12px', textTransform: 'uppercase', textAlign: 'center' } }, 'Customer Reviews'),
                reviews.map((r, i) => h('div', { key: i, className: 'review-item' },
                  h('div', { style: { fontWeight: '700', display: 'flex', justifyContent: 'space-between', marginBottom: '4px' } },
                    h('span', null, r.get('user')),
                    h('span', { style: { color: '#059669', fontSize: '11px' } }, '✔ Verified')
                  ),
                  h('div', { style: { color: '#F59E0B', fontSize: '11px', marginBottom: '4px' } }, '★★★★★'),
                  h('div', null, '"' + (r.get('comment') || '') + '"')
                ))
              ) : null,

              // FAQs
              faqs ? h('div', { style: { marginTop: '28px' } },
                h('div', { style: { fontSize: '15px', fontWeight: '800', marginBottom: '12px', textTransform: 'uppercase', textAlign: 'center' } }, 'FAQ'),
                faqs.map((f, i) => h('div', { key: i, className: 'faq-item' },
                  h('div', { style: { fontWeight: '700', marginBottom: '4px' } }, '☑ ' + (f.get('question') || '')),
                  h('div', { style: { color: '#4B5563', fontSize: '12px', lineHeight: '1.4' } }, f.get('answer') || '')
                ))
              ) : null
            ),

            // Luxury Black Footer
            h('footer', { className: 'luxury-footer' },
              h('div', { className: 'trust-strip' },
                h('div', { className: 'trust-item' }, h('span', null, '🛡️'), h('span', { style: { fontSize: '11px', color: '#FFF' } }, '30-Day Risk-Free Trial')),
                h('div', { className: 'trust-item' }, h('span', null, '✈️'), h('span', { style: { fontSize: '11px', color: '#FFF' } }, 'Tracked Global Shipping')),
                h('div', { className: 'trust-item' }, h('span', null, '🔒'), h('span', { style: { fontSize: '11px', color: '#FFF' } }, '256-Bit Encrypted Vault'))
              ),
              h('div', { style: { textAlign: 'center', fontSize: '11px', color: '#64748B' } },
                '© 2026 ', logo, ' Inc. All rights reserved.'
              )
            )
          );
        }
      });

      CMS.registerPreviewTemplate('settings', LiveCustomizer);
    </script>
  </body>
</html>
