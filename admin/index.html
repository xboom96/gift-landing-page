<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Automatically prompt for GitHub Personal Access Token if not logged in
      if (!localStorage.getItem('netlify-cms-user')) {
        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(() => {
            const btn = document.querySelector('button');
            if (btn) {
              btn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const token = prompt('Enter your GitHub Personal Access Token:');
                if (token) {
                  const user = {
                    backendName: 'github',
                    token: token.trim()
                  };
                  localStorage.setItem('netlify-cms-user', JSON.stringify(user));
                  window.location.reload();
                }
              };
            }
          }, 500);
        });
      }
    </script>
  </body>
</html>
